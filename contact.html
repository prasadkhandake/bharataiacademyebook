<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Bharat AI Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased flex flex-col min-h-screen">

    <nav class="border-b border-gray-800 bg-gray-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="assets/logo-horizontal.png" alt="Bharat AI Academy Logo" class="h-10 w-auto bg-white/90 p-1 rounded">
            </a>
            <div class="space-x-6 text-sm font-medium">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-16 flex-grow w-full">
        <h1 class="text-4xl font-extrabold text-amber-500 mb-4">Contact Us</h1>
        <p class="text-gray-300 mb-8">Have questions regarding the eBook or payment support? Reach out to us below.</p>

        <form class="bg-gray-800/50 p-8 rounded-xl border border-gray-800 space-y-6 shadow-xl">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Your Name</label>
                <input type="text" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="John Doe" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Your Email</label>
                <input type="email" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="john@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Message</label>
                <textarea rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 transition" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-center">Send Message</button>
        </form>
    </main>

    <footer class="bg-gray-950 text-gray-400 py-8 border-t border-gray-800 text-xs">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="assets/logo-horizontal.png" alt="Bharat AI Academy Logo" class="h-8 w-auto bg-white/90 p-1 rounded">
                <p>© 2026 Bharat AI Academy. All rights reserved.</p>
            </div>
            <div class="flex flex-wrap gap-4">
                <a href="index.html" class="hover:text-amber-400">Home</a>
                <a href="about.html" class="hover:text-amber-400">About Us</a>
                <a href="contact.html" class="hover:text-amber-400">Contact</a>
                <a href="privacy-policy.html" class="hover:text-amber-400">Privacy Policy</a>
                <a href="disclaimer.html" class="hover:text-amber-400">Disclaimer</a>
                <a href="terms-and-conditions.html" class="hover:text-amber-400">Terms & Conditions</a>
            </div>
        </div>
    </footer>
</body>
</html>
